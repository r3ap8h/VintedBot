{% extends "base.html" %}
{% block content %}
<h1>Modifier "{{ search.nom }}"</h1>
<p class="sous-titre">id : {{ search.id }}</p>

<div class="carte">
  <form method="post" action="/searches/{{ search.id }}/edit">
    <label for="nom">Nom</label>
    <input type="text" id="nom" name="nom" required value="{{ search.nom }}">

    <label for="mots_cles">Mots-cles</label>
    <input type="text" id="mots_cles" name="mots_cles" value="{{ search.mots_cles }}">

    <label for="prix_min">Prix minimum</label>
    <input type="number" step="0.01" id="prix_min" name="prix_min" value="{{ search.prix_min if search.prix_min is not none else '' }}">

    <label for="prix_max">Prix maximum</label>
    <input type="number" step="0.01" id="prix_max" name="prix_max" value="{{ search.prix_max if search.prix_max is not none else '' }}">

    <label for="intervalle_minutes">Intervalle de verification (minutes, min. 1)</label>
    <input type="number" min="1" id="intervalle_minutes" name="intervalle_minutes" value="{{ search.intervalle_minutes }}">

    <label for="webhook">Webhook Discord pour cette recherche</label>
    <input type="url" id="webhook" name="webhook" placeholder="laisser vide pour utiliser le webhook global" value="{{ search.webhook_url or '' }}">
    <p class="aide">Webhook actuel : {{ webhook_masque }}</p>

    <label for="actif">Etat</label>
    <select id="actif" name="actif">
      <option value="true" {{ "selected" if search.actif else "" }}>Actif</option>
      <option value="false" {{ "selected" if not search.actif else "" }}>Inactif</option>
    </select>

    {% if search.filtres_bruts %}
    <label>Filtres avances (lecture seule — supprime la recherche et recree-la depuis une URL pour les changer)</label>
    <p class="filtres-resume">{{ filtres_resume }}</p>
    {% endif %}

    <p style="margin-top:20px; display:flex; gap:8px;">
      <button class="btn btn-accent" type="submit">Enregistrer</button>
      <a class="btn" href="/">Annuler</a>
    </p>
  </form>
</div>
{% endblock %}
